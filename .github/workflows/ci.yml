name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: 确定性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 三个检查的输出都写入 tests.log，供 AI 评估作为证据。
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          printf '$ gofmt -l .\n%s\n\n' "${out:-（没有需要格式化的文件）}" >> tests.log
          test -z "$out" || { echo "$out"; exit 1; }

      - name: go vet
        run: |
          set -o pipefail
          echo '$ go vet ./...' >> tests.log
          go vet ./... 2>&1 | tee -a tests.log
          printf '（通过）\n\n' >> tests.log

      - name: go test
        run: |
          set -o pipefail
          echo '$ go test -race ./...' >> tests.log
          go test -race -coverprofile=coverage.txt -covermode=atomic ./... 2>&1 | tee -a tests.log

      - name: 保存测试输出
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: tests.log

      - name: 上传覆盖率
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 本作业不运行 PR 中的代码。测试输出来自"确定性检查"作业。
  # 例外：目标分支还没有 ai-eval 时（只在首次引入时出现），使用 PR 中的版本。
  ai-eval:
    name: AI 验收评估
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 判断是否只改了文档
        id: scope
        run: |
          if git diff --name-only "$BASE"...HEAD | grep -qvE '^(docs/.*|README\.md|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "只修改了文档，跳过 AI 评估。"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载测试输出
        if: steps.scope.outputs.code == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tests-log

      - name: 收集评估输入
        if: steps.scope.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[].number' |
            while read -r n; do
              gh issue view "$n" --json number,title,body -q '"## #\(.number) \(.title)\n\n\(.body)\n"'
            done > issues.md
          gh pr view "$PR" --json title,body -q '"# \(.title)\n\n\(.body)"' > pr.md
          git diff "$BASE"...HEAD > pr.diff

      # 评估工具、提示词和规则取自目标分支，被评估的 PR 不能修改它们来影响本次评估。
      - name: 准备目标分支的评估工具
        if: steps.scope.outputs.code == 'true'
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          if [ -d "$RUNNER_TEMP/base/tools/ai-eval" ]; then
            echo "EVAL_DIR=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
          else
            echo "目标分支还没有 ai-eval，本次使用 PR 中的版本。"
            echo "EVAL_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: 运行 AI 评估
        id: eval
        if: steps.scope.outputs.code == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: ${{ env.EVAL_DIR }}
        run: |
          set +e
          # 目标分支的评估工具可能还不支持 --root。不支持时不传，评估照常运行。
          root=()
          if grep -q '"root"' tools/ai-eval/review.go; then root=(--root "$GITHUB_WORKSPACE"); fi
          go run ./tools/ai-eval review \
            --issues "$GITHUB_WORKSPACE/issues.md" --pr "$GITHUB_WORKSPACE/pr.md" --diff "$GITHUB_WORKSPACE/pr.diff" --tests "$GITHUB_WORKSPACE/tests.log" \
            "${root[@]}" --prompt-commit "$(git log -1 --format=%h -- .github/ai-eval/prompt.md)" --out "$GITHUB_WORKSPACE/report.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: 发布评估报告
        if: steps.scope.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f report.md ]; then
            printf '## AI 验收评估：⚠️ 无法判断\n\n评估工具没有生成报告。审阅人需要查看作业日志，并人工确认全部验收标准。\n\n<!-- ai-eval {"verdict":"unknown"} -->\n' > report.md
          fi
          if grep -q '无法判断' report.md; then
            echo "::warning::AI 评估中有无法判断的结论。审阅人需要人工确认，并在 PR 中记录结论。"
          fi
          gh pr comment "$PR" --body-file report.md

      # 推翻方法：审阅人给 PR 加标签 ai-eval-override，再点"Re-run jobs"。本步骤实时读取标签。
      - name: 判定结果
        if: steps.scope.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ steps.eval.outputs.status }}"
          if [ "$status" = "0" ]; then exit 0; fi
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx ai-eval-override; then
            echo "审阅人已用 ai-eval-override 推翻 AI 判断。"
            exit 0
          fi
          echo "AI 评估结论为不通过，或评估工具出错（退出码 $status）。审阅人可加标签 ai-eval-override 后重跑本作业。"
          exit 1

  # main 更新后，把效率指标的表格和折线图写入本次运行的摘要页面。不修改仓库文件。
  stats:
    name: 效率指标
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 生成效率指标
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state merged --limit 500 --json number,mergedAt,labels,comments > prs.json
          { echo '## 效率指标'; echo; go run ./tools/ai-eval stats -prs prs.json; } >> "$GITHUB_STEP_SUMMARY"
